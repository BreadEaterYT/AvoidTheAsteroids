<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <link rel="shortcut icon" href="./img/avoid_the_asteroids.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/index.css">
    <script src="./js/index.js"></script>
    <title>Avoid the asteroids</title>
</head>
<body>
    <div id="background">
        <canvas id="game"></canvas>
        <div id="perks_list"></div>
        <div id="start_menu">
            <div class="menu">
                <div class="menu_context">
                    <h4 id="startmenu_label">Avoid the asteroids !</h4>
                    <p id="made_by">A game by BreadEater</p>
                </div>
                <div id="startmenu_buttons">
                    <input type="text" id="player_name" placeholder="Username..."><br>
                    <button id="start_button">Start</button>
                </div>
            </div>
        </div>
        <div id="gameover_menu">
            <div class="menu">
                <div class="menu_content">
                    <h2 id="gameover_label">Game Over</h2>
                    <p id="final_score">Final Score: 0</p>
                </div>
                <div id="gameover_buttons">
                    <button id="restart_button">Restart</button>
                </div>
            </div>
        </div>
        <div id="pause_menu">
            <div class="menu">
                <div class="menu_content">
                    <h2 id="paused_label">Paused</h2>
                    <hr>
                    <br>
                    <p>Controls</p>
                    <div id="controls">
                        <div>
                            <p>W - Move Up</p>
                        </div>
                        <div>
                            <p>S - Move Down</p>
                        </div>
                        <div>
                            <p>A - Move Left</p>
                        </div>
                        <div>
                            <p>D - Move Right</p>
                        </div>
                        <div>
                            <p>F - Use Perk (non-passive perks)</p>
                        </div>
                    </div>
                </div>
                <div id="menu_buttons">
                    <button id="resume_button">Resume</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
